<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サークル管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サークル管理ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
/* サークル管理ツール — Houdini 研究部のデザインを下敷きにした配色。
   白地・灰色の板・大きな英字見出し。色は役割ごとに決め打ちする。 */
:root{
  --ground:#ffffff; --ground-2:#f5f5f7; --panel:#ffffff; --plate:#f5f5f7;
  --wire:#d2d2d7; --wire-dim:#e8e8ed; --line:var(--wire-dim);
  --ink:#1d1d1f; --ink-mid:#4a4a4f; --ink-dim:#86868b; --on-ink:#ffffff;

  /* 青は「押せる・今いる場所」だけに使う。出欠の色とは混ぜない */
  --flag:#0071e3; --flag-hover:#0062c4; --flag-soft:rgba(0,113,227,.12); --on-flag:#ffffff;
  /* 赤は「注意して」。続けて欠席・至急・削除 */
  --alert:#c4161c; --alert-soft:#fdecec; --alert-line:#f5c6c6;
  /* 橙は「予定・重要」。まだ決まっていない/目を留めてほしいもの */
  --warn-bg:#fff8f2; --warn-line:#f0ddc9; --warn:#9a4b00;

  /* 出欠の5色。学校欠席は「サークル側の問題ではない」ので、あえて無彩色 */
  --s0:#248a3d; --s1:#b25e00; --s2:#0e7c86; --s3:#86868b; --s4:#d70015;
  --s0w:#e2efe4; --s1w:#f3e4d6; --s2w:#dcefef; --s3w:#ececf0; --s4w:#fbe3e3;

  --glass:rgba(255,255,255,.9); --glass-edge:rgba(29,29,31,.08);
  --glass-shadow:0 10px 30px rgba(29,29,31,.07),0 1px 2px rgba(29,29,31,.05);
  --shadow-lift:0 12px 34px rgba(0,0,0,.12);
  --radius:18px;

  --font-display:"Schibsted Grotesk","Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#000000; --ground-2:#161617; --panel:#1c1c1e; --plate:#1c1c1e;
    --wire:#3a3a3e; --wire-dim:#2a2a2d;
    --ink:#f5f5f7; --ink-mid:#c7c7cc; --ink-dim:#8e8e93; --on-ink:#000000;
    --flag:#2997ff; --flag-hover:#54acff; --flag-soft:rgba(41,151,255,.16);
    --alert:#ff6b61; --alert-soft:#3a1a19; --alert-line:#5c2825;
    --warn-bg:#2a2118; --warn-line:#4a3a28; --warn:#f0a35e;
    --s0:#30a14e; --s1:#c77700; --s2:#1596a3; --s3:#6e6e73; --s4:#e5484d;
    --s0w:#1c3322; --s1w:#3a2c1e; --s2w:#15302f; --s3w:#2c2c2f; --s4w:#3d1c1c;
    --glass:rgba(28,28,30,.9); --glass-edge:rgba(255,255,255,.08);
    --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
    --shadow-lift:0 12px 34px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#000000; --ground-2:#161617; --panel:#1c1c1e; --plate:#1c1c1e;
  --wire:#3a3a3e; --wire-dim:#2a2a2d;
  --ink:#f5f5f7; --ink-mid:#c7c7cc; --ink-dim:#8e8e93; --on-ink:#000000;
  --flag:#2997ff; --flag-hover:#54acff; --flag-soft:rgba(41,151,255,.16);
  --alert:#ff6b61; --alert-soft:#3a1a19; --alert-line:#5c2825;
  --warn-bg:#2a2118; --warn-line:#4a3a28; --warn:#f0a35e;
  --s0:#30a14e; --s1:#c77700; --s2:#1596a3; --s3:#6e6e73; --s4:#e5484d;
  --s0w:#1c3322; --s1w:#3a2c1e; --s2w:#15302f; --s3w:#2c2c2f; --s4w:#3d1c1c;
  --glass:rgba(28,28,30,.9); --glass-edge:rgba(255,255,255,.08);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 12px 34px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
/* ページ全体はスクロールさせず、中身(main)だけを動かす。
   Apps Script はページを枠(iframe)の中に出すので、ページごと伸びると
   iPhone では枠が中身の高さまで伸び、下のタブが一緒に流れてしまう。 */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ground)}
body{color:var(--ink);font:15.2px/1.75 var(--font-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
.num,td,.stat b{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:16px;height:16px}

/* ---------- 上のバー ----------
   角の丸い「浮いた板」。後ろが透けるので、いまスクロールしている場所の見当がつく。 */
header{position:fixed;z-index:20;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;max-width:960px;margin:0 auto;height:52px;padding:0 6px 0 16px;
  display:flex;align-items:center;gap:10px;border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header h1{margin:0;font:700 15px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
#who{flex:1;font-size:12px;color:var(--ink-dim);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.iconbtn{border:0;background:transparent;border-radius:12px;width:40px;height:40px;color:var(--ink-mid);display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--ground-2)}

main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(68px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
/* 中身が短い画面(メモ・設定)でも、必ず main の中で1pxはスクロールできるようにする。
   スクロールする余地がないと、iPhone は指の動きを外側のページに渡してしまい、
   画面全体(上下のバーごと)がびよんと動く */
#view{max-width:720px;margin:0 auto;min-height:calc(100% + 1px)}
/* 画面のいちばん上(時計や電池の裏)を地の色で塗りつぶす。
   ここが透けていると、スクロールした中身がぼやけて見える */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(8px + env(safe-area-inset-top));background:var(--ground);z-index:19}
@media (min-width:900px){ #view{max-width:960px} }

/* ---------- 下のタブ ----------
   上のバーと同じ浮いた板。アイコンは線画にそろえる(絵文字は端末ごとに絵柄が変わるため使わない) */
nav.tabs{position:fixed;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;display:flex;
  max-width:420px;margin:0 auto;padding:4px;border-radius:18px;
  background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
nav.tabs[hidden]{display:none}
nav.tabs button{position:relative;flex:1;border:0;background:none;padding:5px 0 4px;border-radius:14px;font:500 10px/1.2 var(--font-body);color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{width:20px;height:20px}
nav.tabs button.on{color:var(--flag);background:var(--flag-soft);font-weight:700}
/* 未読の通知があるときの赤い点(スマホでは上のバーを出さないので、設定タブに付ける) */
nav.tabs button .dot{position:absolute;top:3px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 2px var(--ground)}

/* スマホでは上のバーを出さない。画面の高さを中身に回す。
   名前・通知・最新にするは、設定画面の先頭にまとめてある */
@media (max-width:699px){
  header{display:none}
  main{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  body::before{height:env(safe-area-inset-top)}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
}

/* ---------- 見出し ----------
   大きな英字を先に置き、日本語で言い直す。英字は飾りで、意味は日本語が持つ。 */
.sec{margin:14px 0 14px}
.sec .en{display:block;font:800 clamp(1.9rem,8vw,3rem)/1.02 var(--font-display);letter-spacing:-.035em;color:var(--ink)}
.sec h2{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--ink)}
.sec p{margin:2px 0 0;font-size:13px;color:var(--ink-dim);line-height:1.6}
h2.sub{font:700 13px/1.4 var(--font-body);color:var(--ink-dim);margin:26px 0 10px;letter-spacing:.02em}
h3.grade{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font:800 20px/1 var(--font-display);letter-spacing:-.02em}
h3.grade small{font:500 12px/1 var(--font-body);color:var(--ink-dim);letter-spacing:0}

.card{background:var(--plate);border-radius:var(--radius);padding:16px}
.muted{color:var(--ink-dim)}
.small{font-size:12px;line-height:1.6}
.empty{color:var(--ink-dim);text-align:center;padding:40px 0}

/* ボタンは丸い札。青い塗りは「決定」だけ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--ground-2);color:var(--ink);border-radius:980px;padding:9px 18px;font-weight:500;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--wire-dim)}
.btn.primary{background:var(--flag);color:var(--on-flag);font-weight:700}
.btn.primary:hover{background:var(--flag-hover)}
.btn.danger{color:var(--alert)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.wide{width:100%}
.card .btn:not(.primary){background:var(--ground)}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--wire);background:var(--ground);border-radius:12px;padding:9px 12px;min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--flag);outline-offset:-1px;border-color:transparent}
/* iPhone の日付・時刻の入力欄は、放っておくと決まった幅を持って枠からはみ出す。
   見た目の標準をはずして、ほかの入力欄と同じ高さ・幅に従わせる */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px;line-height:1.3;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1}

/* ---------- 出席 ---------- */
.daybar{display:flex;gap:6px;align-items:center;background:var(--plate);border-radius:var(--radius);padding:6px}
.daybar select{flex:1;min-width:0;border:0;background:transparent;font:700 17px/1.3 var(--font-display);padding:10px 6px;text-align:center;text-align-last:center}
.daybar .iconbtn{width:44px;height:44px;background:var(--ground)}
.dayinfo{display:flex;gap:8px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.dayinfo .time{font-size:13px;color:var(--ink-mid);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:980px;background:var(--flag-soft);color:var(--flag);font-weight:500}
.badge.off{background:var(--ground-2);color:var(--ink-dim)}
.badge.plan{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line);font-weight:700}
.count{margin-left:auto;font-size:13px;color:var(--ink-dim)}
.count b{font:800 18px/1 var(--font-display);color:var(--ink)}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.6}
.planbar{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:14px;padding:10px 10px 10px 14px;margin:12px 0 0;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-mid);margin:12px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.person{background:var(--plate);border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:8px}
.pname{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pname b{font-size:15px;font-weight:700}
.pnote{font-size:12px;color:var(--ink-dim);line-height:1.4}
.stamp{font-size:11px;color:var(--ink-dim)}
.pacts{margin-left:auto;display:flex;gap:6px}
/* 5つ並べても指1本で押せる高さ(44px)を確保する */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.seg button{border:0;background:var(--ground);border-radius:12px;min-height:46px;padding:4px 2px;font-size:12px;font-weight:500;line-height:1.2;word-break:keep-all;color:var(--ink-mid);transition:background .15s,color .15s,transform .1s}
.seg button:active:not(:disabled){transform:scale(.96)}
.seg button.on{color:#fff;font-weight:700}
.seg .s0.on{background:var(--s0)} .seg .s1.on{background:var(--s1)} .seg .s2.on{background:var(--s2)}
.seg .s3.on{background:var(--s3)} .seg .s4.on{background:var(--s4)}
.seg.seg2{grid-template-columns:1fr 1fr}
/* タブレットでは2列に並べて、1画面に入る人数を倍にする */
@media (min-width:900px){
  .persons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .persons .person{margin:0}
}

/* ---------- 回数と A週/B週 ----------
   青は「今いる場所」専用なので、A/B は白黒の反転で見分ける */
.no{font:800 13px/1 var(--font-display);letter-spacing:-.01em;color:var(--ink-mid);white-space:nowrap}
.wk{display:inline-block;font:800 11px/1 var(--font-display);padding:4px 9px;border-radius:980px;letter-spacing:.02em;white-space:nowrap}
.wk.A{background:var(--ink);color:var(--ground)}
.wk.B{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.grp{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:800 10px/1 var(--font-display);vertical-align:1px}
.grp.A{background:var(--ink);color:var(--ground)}
.grp.B{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.reportbar{display:flex;align-items:center;gap:10px;background:var(--plate);border-radius:16px;padding:12px 14px;margin:12px 0 0;font-size:13px}
/* 進捗報告のチェック。出欠の5ボタンとは形を変えて、別の操作だと分かるようにする */
.rep{border:1.5px solid var(--wire);background:var(--ground);color:var(--ink-mid);border-radius:980px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.rep.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- 一覧 ---------- */
/* 数字の札。大きな数字 → 日本語 → 小さな英字、の順に読ませる */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--plate);border-radius:16px;padding:14px 16px}
.stat b{display:block;font:800 30px/1.05 var(--font-display);letter-spacing:-.03em}
.stat b small{font-size:15px;margin-left:2px}
.stat span{display:block;font-size:12px;font-weight:700;margin-top:6px;line-height:1.4}
.stat em{display:block;font:700 9.5px/1 var(--font-display);letter-spacing:.12em;color:var(--ink-dim);font-style:normal;margin-top:3px}
.stat.warn b{color:var(--alert)}
.alert{background:var(--alert-soft);border:1px solid var(--alert-line);color:var(--alert);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;margin:12px 0}
.tablewrap{overflow-x:auto;border-radius:16px;background:var(--plate);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--wire-dim);text-align:center;white-space:nowrap}
th{font-weight:700;color:var(--ink-dim);font-size:11.5px;background:var(--plate)}
/* 名前の列は横に動かしても残す(誰の行か見失わないように) */
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--plate);z-index:1;box-shadow:1px 0 0 var(--wire-dim)}
td.name .pnote{font-size:11px;max-width:9em;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
td.c{padding:5px 3px;min-width:32px}
td.c span{display:inline-block;width:26px;height:26px;line-height:26px;border-radius:50%;font-weight:700;font-size:12px}
.k0{background:var(--s0w);color:var(--s0)} .k1{background:var(--s1w);color:var(--s1)} .k2{background:var(--s2w);color:var(--s2)}
.k3{background:var(--s3w);color:var(--s3)} .k4{background:var(--s4w);color:var(--s4)}
.rate{font-weight:700}
.rate.low{color:var(--alert)}

/* ---------- メモ ---------- */
/* 共有・フィードバック・個人の切り替え。今いる所だけ白い札が乗る */
.segtabs{display:flex;padding:4px;border-radius:14px;background:var(--plate);margin-bottom:12px}
.segtabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:500;color:var(--ink-dim);white-space:nowrap}
.segtabs button.on{background:var(--ground);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.segtabs button small{font:700 11px/1 var(--font-display);margin-left:3px;color:var(--ink-dim)}
.memo{background:var(--plate);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.memo.pinned{box-shadow:inset 0 0 0 1.5px var(--ink)}
.memo .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink-dim)}
.memo .meta .pin{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:700}
.memo .body{white-space:pre-wrap;word-break:break-word;margin:8px 0;line-height:1.7}
.memo .foot{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-dim);flex-wrap:wrap}
.memo .foot .who{font-weight:700;color:var(--ink-mid)}
.memo .foot .sp{flex:1}
.linkbtn{border:0;background:none;color:var(--flag);padding:4px 6px;font-size:12px;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
.linkbtn.danger{color:var(--alert)}
.tag{font-size:11px;font-weight:700;padding:2px 10px;border-radius:980px;background:var(--ground);color:var(--ink-mid)}
.tag.t0{background:var(--flag-soft);color:var(--flag)}
.tag.t1{background:var(--warn-bg);color:var(--warn)}
.imp{font-size:11px;font-weight:800;padding:2px 10px;border-radius:980px}
.imp.i1{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.imp.i2{background:var(--alert);color:#fff}
.filters{display:flex;gap:8px;margin:18px 0 12px}
.filters select{flex:1;border-radius:980px;font-size:14px}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-dim);margin:0 0 10px;line-height:1.6}

/* ---------- 画像 ---------- */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:8px 0}
.pic{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--ground-2);border:0;padding:0}
/* 正方形に切り抜いて並べ、押すと全体を見せる(一覧で縦横がばらつかないように) */
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:24px;padding:0}
.pic.loading::after{content:"…";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px}
#viewer.show{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

/* ---------- 設定 ---------- */
details{background:var(--plate);border-radius:var(--radius);margin-bottom:10px}
summary{padding:16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--ink-dim);font-weight:400}
details[open] summary::after{content:"－"}
details > .inner{padding:0 16px 16px}
.list-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--wire-dim);flex-wrap:wrap}
.list-row.inactive{opacity:.5}
.member-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--wire-dim)}
.member-row .sub{grid-column:1/-1;display:flex;gap:6px}
.member-row .sub input{flex:1}
.member-row.inactive{opacity:.5}
.month{font:800 18px/1 var(--font-display);letter-spacing:-.02em;margin:18px 0 6px}
/* 日程の1行。押すと編集画面が開く */
.day-item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--wire-dim);background:none;text-align:left;color:var(--ink)}
.day-item:hover:not(:disabled){background:var(--ground-2)}
.day-item:disabled{opacity:1;cursor:default}
.day-item .d{font-weight:700;font-size:14px;white-space:nowrap}
.day-item .t{font-size:12px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-item .m{display:flex;gap:6px;align-items:center;justify-self:end}
.day-item.inactive .d,.day-item.inactive .t{opacity:.5}
.acc-row{display:grid;grid-template-columns:1fr 90px 80px 30px;gap:6px;padding:8px 0;border-top:1px solid var(--wire-dim)}
@media (max-width:480px){.acc-row{grid-template-columns:1fr 1fr 30px}.acc-row .email{grid-column:1/-1}}
.acc-row .acc-key,.acc-row .acc-link{grid-column:1/-1}
.acc-row .acc-key{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px}
.acc-row .acc-link{background:var(--ground);border-radius:12px;padding:10px;margin-top:2px}
.acc-row .acc-link input{width:100%;font:12px/1.4 ui-monospace,Consolas,monospace}
.help p{margin:6px 0;font-size:14px}
/* 明暗の切り替え。「自動」は端末の設定に合わせる */
.theme-switch{display:inline-flex;padding:3px;border-radius:980px;background:var(--ground)}
.theme-switch button{border:0;background:none;border-radius:980px;padding:6px 16px;font-size:13px;color:var(--ink-dim)}
.theme-switch button.on{background:var(--ink);color:var(--ground);font-weight:700}

/* ---------- 編集シート ----------
   スマホでは下から出る板、タブレット以上では真ん中の窓。
   板そのものは動かさず、中身だけをスクロールさせる(閉じるボタンが画面外へ逃げないように) */
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .panel{background:var(--ground);width:100%;max-width:560px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lift)}
@media (min-width:700px){ #sheet{align-items:center} #sheet .panel{border-radius:22px;max-height:86%} }
#sheet .head{display:flex;align-items:center;gap:8px;padding:12px 16px 2px}
#sheet .head h3{margin:0;font:800 22px/1.1 var(--font-display);letter-spacing:-.02em;flex:1}
#sheet .body{overflow-y:auto;overflow-x:hidden;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
#sheet .foot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--wire-dim)}
.field{display:block;margin:6px 0;min-width:0}
.field > span{display:block;font-size:12px;font-weight:700;color:var(--ink-mid);margin-bottom:4px}
.field > span small{font-weight:400;color:var(--ink-dim);margin-left:4px}
.field input,.field select{width:100%;max-width:100%;min-width:0;display:block}
/* 2列の欄。minmax(0,1fr) にしないと、中身の幅に押されて列がはみ出す */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two.no{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}
.toggles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0 4px}
.toggles .toggle{margin:0}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--plate);border-radius:14px;margin:10px 0}
.toggle .tx{flex:1;font-size:14px;font-weight:700}
.toggle .tx small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-dim)}
/* iOS風のスイッチ */
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--wire);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--s0)}
.sw:checked::after{transform:translateX(20px)}

/* ---------- リアクション・返信 ---------- */
.reacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.rc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--wire-dim);background:var(--ground);border-radius:980px;padding:3px 10px;font-size:14px;line-height:1.4}
.rc b{font:700 12px/1 var(--font-display);color:var(--ink-mid)}
/* 自分が付けたものは青い縁(押すと外せる、という合図) */
.rc.mine{border-color:var(--flag);background:var(--flag-soft)}
.rc.mine b{color:var(--flag)}
.rc.add{color:var(--ink-dim);padding:3px 8px}
.picker{display:flex;gap:4px;padding:4px;border-radius:980px;background:var(--ground);box-shadow:var(--glass-shadow);border:1px solid var(--wire-dim)}
.picker button{border:0;background:none;font-size:20px;line-height:1;padding:6px;border-radius:50%}
.picker button:hover{background:var(--ground-2)}
.thread{margin-top:10px;padding-top:10px;border-top:1px solid var(--wire-dim)}
.reply{display:flex;flex-direction:column;padding:6px 0 6px 12px;border-left:2px solid var(--wire)}
.reply + .reply{margin-top:6px}
.reply .rh{font-size:12px;color:var(--ink-dim);display:flex;gap:6px;align-items:center}
.reply .rh b{color:var(--ink-mid)}
.reply .rb{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6}
.replybox{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.replybox textarea{min-height:42px;height:42px;padding:9px 12px;border-radius:21px;flex:1}
.memo.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 2px var(--flag)}100%{box-shadow:none}}

/* ---------- 通知 ---------- */
.bell{position:relative}
.bell .dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--alert);color:#fff;font:800 10px/17px var(--font-display);text-align:center}
.nf{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--wire-dim)}
.nf:first-child{border-top:0}
.nf .go{flex:1;border:0;background:none;text-align:left;padding:0;color:var(--ink);font-size:14px;line-height:1.5}
.nf .go small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:2px}
.nf .mark{width:8px;height:8px;border-radius:50%;background:var(--flag);margin-top:8px;flex:none}
.nf.read .mark{background:transparent}
.nf.read .go{color:var(--ink-mid)}

/* ---------- 読み込み中の画面 ----------
   アイコンと同じ絵を、明暗それぞれの色で描く(線は --ink、✓は --flag、切れ目は地の色)。
   読み込んでいるあいだは✓を描いては消し、終わったら少し大きくなりながら消える */
#splash{position:fixed;inset:0;z-index:100;background:var(--ground);display:grid;place-items:center;transition:opacity .35s ease, transform .35s ease}
#splash svg{width:112px;height:112px}
#splash .ring{fill:none;stroke:var(--ink);stroke-width:30}
#splash .halo{fill:none;stroke:var(--ground);stroke-width:84;stroke-linecap:round;stroke-linejoin:round}
#splash .chk{fill:none;stroke:var(--flag);stroke-width:44;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.3s cubic-bezier(.65,0,.35,1) infinite}
@keyframes draw{0%{stroke-dashoffset:520}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-520}}
#splash.done{opacity:0;transform:scale(1.08);pointer-events:none}
#splash.done .chk{animation:none;stroke-dashoffset:0}
@media (prefers-reduced-motion: reduce){ #splash .chk{animation:none;stroke-dashoffset:0} #splash{transition:opacity .2s} #splash.done{transform:none} }

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:980px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow-lift)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--alert);color:#fff}
#savebar{font-size:12px;color:var(--ink-dim);text-align:right;min-height:18px;margin-top:6px}
#savebar.err{color:var(--alert)}
.fatal{max-width:480px;margin:60px auto;padding:0 16px;text-align:center}

/* =========================================================
   リキッドグラス(日付のバー・上のバー・下のタブだけ)
   背景は塗らない。後ろを流れる中身を、にじませて(blur)色を少し濃くして(saturate)透かす。
   上の縁に明るい線、下の縁にごく薄い影を入れて、ガラスの厚みに見せる。
   ========================================================= */
:root{
  --lq-fill:rgba(255,255,255,.55); --lq-fill-2:rgba(255,255,255,.35);
  --lq-edge:rgba(255,255,255,.95); --lq-line:rgba(29,29,31,.08); --lq-under:rgba(29,29,31,.05);
  --lq-btn:rgba(255,255,255,.6);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lq-fill:rgba(40,40,44,.5); --lq-fill-2:rgba(24,24,28,.38);
    --lq-edge:rgba(255,255,255,.16); --lq-line:rgba(255,255,255,.08); --lq-under:rgba(0,0,0,.3);
    --lq-btn:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --lq-fill:rgba(40,40,44,.5); --lq-fill-2:rgba(24,24,28,.38);
  --lq-edge:rgba(255,255,255,.16); --lq-line:rgba(255,255,255,.08); --lq-under:rgba(0,0,0,.3);
  --lq-btn:rgba(255,255,255,.08);
}
header,nav.tabs,.daybar{
  background:linear-gradient(180deg,var(--lq-fill),var(--lq-fill-2));
  border:1px solid var(--lq-line);
  box-shadow:inset 0 1px 0 var(--lq-edge), inset 0 -1px 0 var(--lq-under), var(--glass-shadow);
  -webkit-backdrop-filter:saturate(190%) blur(22px);backdrop-filter:saturate(190%) blur(22px)}
.daybar .iconbtn{background:var(--lq-btn);box-shadow:inset 0 1px 0 var(--lq-edge), inset 0 0 0 1px var(--lq-line)}
/* 日付のバーは、下に流れる出欠の札の上に浮かせる(透けて見えるように、スクロールしても上に残す) */
/* スマホだけ。PCは画面が広く、上に残すと邪魔なのでふつうに流す */
@media (max-width:699px){ .daybar{position:sticky;top:calc(16px + env(safe-area-inset-top));z-index:5} }

/* 画面の上端。時計や電池の裏は地の色で塗り、その下はふわっと消して、タイトルと重ならないようにする */
body::before{background:linear-gradient(180deg,var(--ground) 60%,color-mix(in srgb,var(--ground) 0%,transparent))}
@media (max-width:699px){
  body::before{height:calc(16px + env(safe-area-inset-top))}
  main{padding-top:calc(28px + env(safe-area-inset-top))}
}

/* 端で引っぱったときに、外側のページ(白地)ごと動かないようにする。
   中身は常に上下に2pxだけ余分にスクロールでき、指を置いたとき端にいたら1pxだけずらす(下の JS) */
#view{min-height:calc(100% + 2px)}
#viewer,#splash{touch-action:none}
#sheet,#sheet .body{overscroll-behavior:contain}
</style>
</head>
<body>
<div id="splash" aria-label="読み込み中"><svg viewBox="0 0 512 512" aria-hidden="true">
  <circle class="ring" cx="256" cy="256" r="150"/>
  <path class="halo" d="M178 262 L242 324 L432 96"/>
  <path class="chk" d="M178 262 L242 324 L432 96"/>
</svg></div>
<header>
  <h1>サークル管理ツール</h1>
  <div id="who"></div>
  <button class="iconbtn bell" id="bell" title="通知" data-act="openNotifs" hidden></button>
  <button class="iconbtn" id="reload" title="最新の状態に更新"></button>
</header>
<main id="main"><div id="view"><p class="empty">読み込み中…</p></div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheet"></div>
<div id="viewer" data-act="closeViewer"><img alt=""></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
